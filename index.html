<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#8a5a2b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="詰将棋ボード" />
    <title>詰将棋ボード</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./icon.svg" />
  </head>
  <body>
    <div id="app">
      <header class="app-header">
        <h1>詰将棋ボード</h1>
        <span id="turn-indicator" class="turn-indicator"></span>
      </header>
      <main class="main">
        <section class="board-column">
          <div id="hand-top" class="hand-bar"></div>
          <div class="board-wrap">
            <div id="board" class="board"></div>
            <div id="promote-dialog" class="promote-dialog" hidden>
              <div class="promote-title">成りますか？</div>
              <div class="promote-buttons">
                <button id="promote-yes" type="button">成る</button>
                <button id="promote-no" type="button">成らない</button>
              </div>
            </div>
          </div>
          <div id="hand-bottom" class="hand-bar"></div>
          <div class="board-controls">
            <button id="undo-button" type="button">待った</button>
            <button id="reset-button" type="button">初期局面に戻す</button>
            <button id="flip-button" type="button">反転</button>
          </div>
        </section>
        <aside class="panel">
          <section class="panel-section">
            <h2>棋譜の貼り付け</h2>
            <div class="button-row">
              <button id="paste-button" type="button">
                クリップボードから貼り付け
              </button>
              <button id="paste-manual-button" type="button">
                テキストで貼り付け
              </button>
            </div>
            <p id="paste-message" class="message" role="status"></p>
            <div id="paste-panel" class="paste-panel" hidden>
              <textarea
                id="paste-textarea"
                rows="8"
                placeholder="SFEN / KIF / CSA / BOD のテキストをここに貼り付けてください"
              ></textarea>
              <div class="button-row">
                <button id="paste-load-button" type="button">読み込む</button>
                <button id="paste-close-button" type="button">閉じる</button>
              </div>
            </div>
          </section>
          <section class="panel-section">
            <h2>詰み探索（詰将棋式）</h2>
            <div class="solver-controls">
              <label>
                最大手数
                <select id="max-plies">
                  <option value="7">7手</option>
                  <option value="11">11手</option>
                  <option value="15" selected>15手</option>
                  <option value="21">21手</option>
                  <option value="31">31手</option>
                </select>
              </label>
              <label>
                制限時間
                <select id="time-limit">
                  <option value="5">5秒</option>
                  <option value="10" selected>10秒</option>
                  <option value="30">30秒</option>
                </select>
              </label>
            </div>
            <div class="button-row">
              <button id="search-button" type="button">詰み探索</button>
              <button id="cancel-search-button" type="button" disabled>
                キャンセル
              </button>
            </div>
            <p id="solver-status" class="message" role="status"></p>
            <p id="solver-result" class="solver-result"></p>
            <div class="button-row" id="replay-controls" hidden>
              <button id="replay-back" type="button">◀ 戻る</button>
              <span id="replay-indicator"></span>
              <button id="replay-forward" type="button">進む ▶</button>
            </div>
          </section>
          <section class="panel-section">
            <h2>現在の局面（SFEN）</h2>
            <p id="sfen-display" class="sfen-display"></p>
          </section>
        </aside>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
